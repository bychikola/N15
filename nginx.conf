# Nginx configuration for N15
# Place at: /etc/nginx/sites-available/n15
# Then: ln -s /etc/nginx/sites-available/n15 /etc/nginx/sites-enabled/

server {
    listen 80;
    server_name n15.ru www.n15.ru;

    # Redirect HTTP to HTTPS (uncomment after SSL setup)
    # return 301 https://$host$request_uri;

    # Upload limit for admin panel
    client_max_body_size 50M;

    # Proxy to Next.js
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 120s;
    }

    # Static files — serve directly
    location /_next/static {
        alias /var/www/n15/.next/static;
        expires 365d;
        add_header Cache-Control "public, immutable";
    }

    # Media uploads
    location /media {
        alias /var/www/n15/media;
        expires 7d;
    }

    # Public assets
    location /public {
        alias /var/www/n15/public;
        expires 30d;
    }
}

