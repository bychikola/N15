# N15 — контейнерная версия nginx (монтируется в nginx:alpine как default.conf)

server {
    listen 80;
    server_name n15.ru www.n15.ru;

    client_max_body_size 50M;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name n15.ru www.n15.ru;

    ssl_certificate     /etc/letsencrypt/live/n15.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/n15.ru/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    client_max_body_size 50M;

    location / {
        proxy_pass http://app:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 120s;
    }
}
